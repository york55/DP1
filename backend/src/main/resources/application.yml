server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tasfb2b
  datasource:
    #url: ${DB_URL:jdbc:mysql://localhost:3306/tasfb2b}
    url: ${DB_URL:jdbc:mysql://tasfb2b-mysql:3306/tasfb2b?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Abcd.1234#}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none # cambiado para mayor seguridad en general
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

tasf:
  uploads:
    dir: uploads
  simulation:
    tick-interval-ms: 1000
    tick-duration-minutes: 5     # 1 real second = 5 simulated minutes -> 12 ticks (12s) per 1h block
    block-size-hours: 1          # ALNS plans in 1h rolling blocks (was 2h — smaller context, faster per-block planning)
    flight-lookahead-hours: 16   # flights visible to ALNS per block (was 24 — 16h covers same-day flights + multi-hop connections)
    max-batches-per-block: 200   # cap batches per block to keep ALNS fast
    default-threshold-amber: 75
    default-threshold-red: 90
  alns:
    default-t0: 50.0
    default-alpha: 0.99
    default-q-pct: 0.35
    default-max-iterations: 80
    default-seg-len: 20


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    pe.pucp.tasfb2b: INFO
    org.springframework.web.socket: INFO
    org.hibernate.SQL: WARN
