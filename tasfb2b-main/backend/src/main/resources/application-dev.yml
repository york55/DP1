spring:
  datasource:
    url: jdbc:h2:file:./data/tasfb2b;MODE=MySQL;DATABASE_TO_UPPER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

logging:
  level:
    pe.pucp.tasfb2b: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
