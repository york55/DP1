spring:
  datasource:
    url: jdbc:h2:file:./data/tasfb2b;MODE=MySQL;DATABASE_TO_UPPER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

tasf:
  simulation:
    tick-interval-ms: 8000
    max-batches-per-block: 50

logging:
  level:
    pe.pucp.tasfb2b: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

uploads:
  dir: uploads