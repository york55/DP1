spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tasfb2b?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Abcd.1234#
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true


tasf:
  simulation:
    tick-interval-ms: 8000
    max-batches-per-block: 50

logging:
  level:
    pe.pucp.tasfb2b: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

uploads:
  dir: uploads