server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tasfb2b
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tasfb2b?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:tasfb2b_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

tasf:
  simulation:
    tick-interval-ms: 1000
    tick-duration-minutes: 30
    default-threshold-amber: 75
    default-threshold-red: 90
  alns:
    default-t0: 100.0
    default-alpha: 0.9995
    default-q-pct: 0.25
    default-max-iterations: 1000
    default-seg-len: 100


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    pe.pucp.tasfb2b: DEBUG
    org.springframework.web.socket: INFO
    org.hibernate.SQL: WARN
